<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LavaChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0c0c0e;
    --surface:   #131316;
    --border:    #222228;
    --muted:     #3a3a45;
    --dim:       #666680;
    --text:      #e8e8f0;
    --accent:    #ff5c3a;
    --accent2:   #ff8c6b;
    --green:     #3ddc84;
    --mono:      'DM Mono', monospace;
    --sans:      'Syne', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }

  /* ── Grain overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: .5;
  }

  /* ── Screens ── */
  .screen {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
  }
  .screen.active {
    opacity: 1; pointer-events: all;
  }

  /* ── Logo mark ── */
  .logo {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 48px;
  }
  .logo-mark {
    width: 36px; height: 36px;
    background: var(--accent);
    clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    position: relative;
    animation: lava-pulse 3s ease-in-out infinite;
  }
  @keyframes lava-pulse {
    0%, 100% { transform: scale(1);    filter: brightness(1); }
    50%       { transform: scale(1.08); filter: brightness(1.2); }
  }
  .logo-text {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -.5px;
    color: var(--text);
  }
  .logo-text span { color: var(--accent); }

  /* ── Card ── */
  .card {
    width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 40px;
  }

  .card-title {
    font-size: 13px;
    font-family: var(--mono);
    color: var(--dim);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  /* ── Form elements ── */
  label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
    transition: border-color .2s;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  input[type="text"]::placeholder { color: var(--muted); }

  /* ── Buttons ── */
  .btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 3px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .04em;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .btn:hover  { background: var(--accent2); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { background: var(--muted); cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    margin-top: 10px;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: transparent; }

  /* ── Progress steps ── */
  .steps {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .step {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    transition: color .3s;
  }
  .step.done  { color: var(--green); }
  .step.active { color: var(--text); }
  .step-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background .3s;
  }
  .step.done .step-dot  { background: var(--green); }
  .step.active .step-dot {
    background: var(--accent);
    animation: dot-pulse .8s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: .5; transform: scale(1.4); }
  }

  /* ── Role selector ── */
  .role-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-top: 8px;
  }
  .role-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 20px 16px;
    cursor: pointer;
    transition: border-color .2s;
    text-align: center;
  }
  .role-card:hover       { border-color: var(--muted); }
  .role-card.selected    { border-color: var(--accent); }
  .role-card .role-icon  { font-size: 24px; margin-bottom: 10px; }
  .role-card .role-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
  }
  .role-card.selected .role-label { color: var(--accent); }

  /* ── Waiting indicator ── */
  .waiting {
    display: flex; align-items: center; gap: 10px;
    margin-top: 24px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
  }
  .waiting-dots span {
    display: inline-block;
    animation: blink 1.4s infinite;
  }
  .waiting-dots span:nth-child(2) { animation-delay: .2s; }
  .waiting-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }

  /* ── Error ── */
  .error-msg {
    margin-top: 14px;
    padding: 10px 12px;
    background: rgba(255,92,58,.08);
    border: 1px solid rgba(255,92,58,.3);
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    display: none;
  }
  .error-msg.visible { display: block; }

  /* ══════════════════════════════════
     ÉCRAN 3 — CHAT
  ══════════════════════════════════ */
  #screen-chat {
    flex-direction: column;
    align-items: stretch;
  }

  .chat-layout {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 0 0;
  }

  /* Header */
  .chat-header {
    display: flex; align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    gap: 14px;
    flex-shrink: 0;
  }
  .chat-peer {
    flex: 1;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
  }
  .chat-peer span { color: var(--dim); }
  .badge-encrypted {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--green);
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid rgba(61,220,132,.25);
    border-radius: 2px;
  }
  .badge-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--green);
    animation: dot-pulse .8s ease-in-out infinite;
  }

  /* Messages */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 72%;
    animation: msg-in .2s ease;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.sent  { align-self: flex-end; align-items: flex-end; }
  .msg.recv  { align-self: flex-start; align-items: flex-start; }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    word-break: break-word;
  }
  .msg.sent .msg-bubble {
    background: var(--accent);
    color: #fff;
  }
  .msg.recv .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .msg-meta {
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  /* System messages */
  .msg-system {
    align-self: center;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
    letter-spacing: .06em;
  }

  /* Input */
  .chat-input-wrap {
    display: flex; gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 11px 14px;
    outline: none;
    resize: none;
    transition: border-color .2s;
    min-height: 44px;
    max-height: 120px;
  }
  .chat-input:focus { border-color: var(--accent); }
  .chat-input::placeholder { color: var(--muted); }

  .send-btn {
    width: 44px; height: 44px;
    background: var(--accent);
    border: none; border-radius: 3px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .2s;
    align-self: flex-end;
  }
  .send-btn:hover  { background: var(--accent2); }
  .send-btn svg { fill: #fff; width: 16px; height: 16px; }

  /* ── Cipher modal ── */
  #cipher-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  #cipher-modal.visible { display: flex; }
  .modal-box {
    width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px;
    animation: msg-in .2s ease;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .modal-header button {
    background: none; border: none;
    color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .modal-header button:hover { color: var(--text); }
  .modal-field { margin-bottom: 16px; }
  .modal-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .modal-value {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    word-break: break-all;
    line-height: 1.6;
    padding: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .msg { cursor: pointer; }
  .msg:hover .msg-bubble { opacity: .85; transition: opacity .15s; }
</style>
</head>
<body>

<!-- ══════════════════════════════════
     ÉCRAN 1 — CONNEXION
══════════════════════════════════ -->
<div class="screen active" id="screen-login">
  <div>
    <div class="logo">
      <div class="logo-mark"></div>
      <div class="logo-text">Lava<span>Chat</span></div>
    </div>
    <div class="card">
      <div class="card-title">Connexion</div>
      <label for="input-username">Identifiant</label>
      <input type="text" id="input-username" placeholder="alice" autocomplete="off" />
      <label for="input-password" style="margin-top:16px;">Mot de passe</label>
      <input type="password" id="input-password" placeholder="••••••••" autocomplete="off" />
      <button class="btn" id="btn-connect">Se connecter</button>
      <div class="error-msg" id="err-login"></div>
      <div class="steps" id="steps" style="display:none">
        <div class="step" id="step-register">
          <div class="step-dot"></div><span>Inscription sur le serveur</span>
        </div>
        <div class="step" id="step-seed">
          <div class="step-dot"></div><span>Capture entropie lavalamp</span>
        </div>
        <div class="step" id="step-keys">
          <div class="step-dot"></div><span>Génération clés RSA</span>
        </div>
        <div class="step" id="step-publish">
          <div class="step-dot"></div><span>Publication clé publique</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════
     ÉCRAN 2 — HANDSHAKE
══════════════════════════════════ -->
<div class="screen" id="screen-handshake">
  <div>
    <div class="logo">
      <div class="logo-mark"></div>
      <div class="logo-text">Lava<span>Chat</span></div>
    </div>
    <div class="card">
      <div class="card-title">Établir une session</div>
      <label>Votre rôle</label>
      <div class="role-grid">
        <div class="role-card" id="role-init" onclick="selectRole('init')">
          <div class="role-icon">⚡</div>
          <div class="role-label">Initiateur</div>
        </div>
        <div class="role-card" id="role-recv" onclick="selectRole('recv')">
          <div class="role-icon">📡</div>
          <div class="role-label">Récepteur</div>
        </div>
      </div>

      <!-- Initiateur -->
      <div id="panel-init" style="display:none; margin-top:20px;">
        <label for="input-dest">Username du destinataire</label>
        <input type="text" id="input-dest" placeholder="bob" autocomplete="off" />
        <button class="btn" id="btn-init">Envoyer la clé de session</button>
      </div>

      <!-- Récepteur -->
      <div id="panel-recv" style="display:none; margin-top:20px;">
        <button class="btn" id="btn-recv">Attendre la connexion</button>
        <div class="waiting" id="waiting-recv" style="display:none">
          <span>En attente d'un initiateur</span>
          <div class="waiting-dots">
            <span>.</span><span>.</span><span>.</span>
          </div>
        </div>
      </div>

      <div class="error-msg" id="err-handshake"></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════
     ÉCRAN 3 — CHAT
══════════════════════════════════ -->
<div class="screen" id="screen-chat">
  <div class="chat-layout">

    <div class="chat-header">
      <div class="logo-mark" style="width:24px;height:24px;"></div>
      <div class="chat-peer">
        <span>avec </span><span id="peer-name">—</span>
      </div>
      <div class="badge-encrypted">
        <div class="badge-dot"></div>
        AES-GCM chiffré
      </div>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="msg-system">session chiffrée établie</div>
    </div>

    <div class="chat-input-wrap">
      <textarea class="chat-input" id="chat-input"
        placeholder="Message…" rows="1"></textarea>
      <button class="send-btn" id="btn-send" title="Envoyer">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>

  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let ws        = null;
let myName    = '';
let peerName  = '';
let role      = null;   // 'init' | 'recv'

// ── Screen transitions ────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── Step helpers ──────────────────────────────────────────────────────────────
function stepActive(id) {
  const el = document.getElementById(id);
  el.classList.remove('done');
  el.classList.add('active');
}
function stepDone(id) {
  const el = document.getElementById(id);
  el.classList.remove('active');
  el.classList.add('done');
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('visible');
}
function clearError(id) {
  document.getElementById(id).classList.remove('visible');
}

// ── Écran 1 — Connexion ───────────────────────────────────────────────────────
document.getElementById('btn-connect').addEventListener('click', async () => {
  clearError('err-login');
  myName = document.getElementById('input-username').value.trim();
  if (!myName) { showError('err-login', 'Veuillez saisir un identifiant.'); return; }

  const btn = document.getElementById('btn-connect');
  btn.disabled = true;
  document.getElementById('steps').style.display = 'flex';

  // Animation des steps (le serveur fait tout en une requête,
  // on anime les étapes visuellement avec de petits délais)
  stepActive('step-register');
  await delay(300);
  stepDone('step-register');
  stepActive('step-seed');
  await delay(400);
  stepDone('step-seed');
  stepActive('step-keys');
  await delay(300);
  stepDone('step-keys');
  stepActive('step-publish');

  try {
    const r = await fetch('/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: myName, password: document.getElementById('input-password').value }),
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'Erreur serveur.');
    stepDone('step-publish');
    await delay(400);
    openWebSocket();
  } catch (e) {
    showError('err-login', e.message);
    btn.disabled = false;
  }
});

document.getElementById('input-username').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-connect').click();
});
document.getElementById('input-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-connect').click();
});

// ── WebSocket bridge ──────────────────────────────────────────────────────────
function openWebSocket() {
  ws = new WebSocket(`ws://localhost:5000/ws?user=${encodeURIComponent(myName)}`);

  ws.onopen = () => {
    showScreen('screen-handshake');
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'message') {
        appendMessage(msg.from, msg, 'recv');
      } else if (msg.type === 'error') {
        appendSystem(`erreur : ${msg.reason}`);
      }
    } catch (_) {}
  };

  ws.onclose = () => {
    appendSystem('connexion fermée');
  };
}

// ── Écran 2 — Handshake ───────────────────────────────────────────────────────
function selectRole(r) {
  role = r;
  document.getElementById('role-init').classList.toggle('selected', r === 'init');
  document.getElementById('role-recv').classList.toggle('selected', r === 'recv');
  document.getElementById('panel-init').style.display = r === 'init' ? 'block' : 'none';
  document.getElementById('panel-recv').style.display = r === 'recv' ? 'block' : 'none';
}

document.getElementById('btn-init').addEventListener('click', async () => {
  clearError('err-handshake');
  const dest = document.getElementById('input-dest').value.trim();
  if (!dest) { showError('err-handshake', 'Veuillez saisir le destinataire.'); return; }

  document.getElementById('btn-init').disabled = true;
  try {
    const r = await fetch('/handshake/init', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: myName, destinataire: dest }),
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'Erreur handshake.');
    peerName = dest;
    enterChat();
  } catch (e) {
    showError('err-handshake', e.message);
    document.getElementById('btn-init').disabled = false;
  }
});

document.getElementById('btn-recv').addEventListener('click', async () => {
  clearError('err-handshake');
  document.getElementById('btn-recv').disabled = true;
  document.getElementById('waiting-recv').style.display = 'flex';
  try {
    const r = await fetch('/handshake/wait', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: myName, password: document.getElementById('input-password').value }),
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'Délai dépassé.');
    peerName = data.destinataire;
    enterChat();
  } catch (e) {
    showError('err-handshake', e.message);
    document.getElementById('btn-recv').disabled = false;
    document.getElementById('waiting-recv').style.display = 'none';
  }
});

// ── Écran 3 — Chat ────────────────────────────────────────────────────────────
function enterChat() {
  document.getElementById('peer-name').textContent = peerName;
  showScreen('screen-chat');
  document.getElementById('chat-input').focus();
}

function appendMessage(from, msg, direction) {
  const container = document.getElementById('chat-messages');
  let text = msg._plain !== undefined
    ? msg._plain
    : (msg.ciphertext ? '[message chiffré]' : (msg.text || ''));

  const time = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

  const div = document.createElement('div');
  div.className = `msg ${direction}`;

  // Stockage des données chiffrées
  if (msg.nonce)      div.dataset.nonce      = msg.nonce;
  if (msg.ciphertext) div.dataset.ciphertext = msg.ciphertext;
  if (msg.tag)        div.dataset.tag        = msg.tag;

  div.innerHTML = `
    <div class="msg-bubble">${escapeHtml(text)}</div>
    <div class="msg-meta">${direction === 'sent' ? 'vous' : escapeHtml(from)} · ${time} · <span style="color:var(--muted);font-size:10px">cliquer pour voir chiffré</span></div>
  `;

  div.addEventListener('click', () => showCipherModal(div.dataset));
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function appendSystem(text) {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg-system';
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ── Envoi de messages ─────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text  = input.value.trim();
  if (!text || !ws) return;

  // On envoie au serveur Flask qui se charge du chiffrement AES
  try {
    const r = await fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: myName, text, to: peerName }),
    });
    const data = await r.json();
    if (data.ok) {
      appendMessage(myName, { _plain: text, nonce: data.nonce, ciphertext: data.ciphertext, tag: data.tag }, 'sent');
      input.value = '';
      input.style.height = 'auto';
    }
  } catch (e) {
    appendSystem(`erreur envoi : ${e.message}`);
  }
}

document.getElementById('btn-send').addEventListener('click', sendMessage);
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Auto-resize textarea
document.getElementById('chat-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Cipher modal ─────────────────────────────────────────────────────────────
function showCipherModal(data) {
  document.getElementById('modal-nonce').textContent      = data.nonce      || '—';
  document.getElementById('modal-ciphertext').textContent = data.ciphertext || '—';
  document.getElementById('modal-tag').textContent        = data.tag        || '—';
  document.getElementById('cipher-modal').classList.add('visible');
}

</script>

<!-- ── Cipher modal ── -->
<div id="cipher-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span>Données chiffrées AES-GCM</span>
      <button id="modal-close">✕</button>
    </div>
    <div class="modal-field">
      <div class="modal-label">Nonce</div>
      <div class="modal-value" id="modal-nonce"></div>
    </div>
    <div class="modal-field">
      <div class="modal-label">Ciphertext</div>
      <div class="modal-value" id="modal-ciphertext"></div>
    </div>
    <div class="modal-field">
      <div class="modal-label">Tag</div>
      <div class="modal-value" id="modal-tag"></div>
    </div>
  </div>
</div>

<script>
document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('cipher-modal').classList.remove('visible');
});
document.getElementById('cipher-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('cipher-modal'))
    document.getElementById('cipher-modal').classList.remove('visible');
});
</script>
</body>
